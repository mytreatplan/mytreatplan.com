# Scheduled jobs (story 1.9). One job per line:
#
#     name | manage.py command and arguments | schedule
#
# - name: lowercase letters, digits, '-' or '_'. It names the timer
#   (mytp-<site>-job@<name>.timer) and the Sentry cron monitor (mytp-<site>-<name>).
# - schedule: a systemd OnCalendar expression ending in UTC, of the form
#   `[Mon..Fri ]*-*-<day|*> <hour|*>:<minute>[/<step>][:00] UTC` (a step: every <step>
#   minutes, mytp-core 0.3.0), so it also maps to the
#   Sentry monitor's crontab (see mytp_core/jobs.py in the mytp-core package).
#
# After changing this file, run deploy/provision.sh again on the server (it installs,
# updates and removes the timers). The job itself runs from the live release, via
# deploy/run-job.sh and `manage.py runjob <name>`.

clearsessions | clearsessions | *-*-* 03:30:00 UTC
backupdb | backupdb | *-*-* 02:30:00 UTC
kmscheck | kmscheck | *-*-* 04:00:00 UTC
purgepending | purge_pending_signups | *-*-* *:15:00 UTC
eventlogretention | eventlog_retention | *-*-* 03:45:00 UTC
purgeerased | purge_erased_accounts | *-*-* 04:15:00 UTC
# Background tasks (AD-8, epic-platform entry 9): every 5 minutes enqueue the worker
# heartbeat (the worker checks in on Sentry monitor mytp-<site>-worker); daily delete
# task results finished 14 days ago (failed ones after 30 days).
workerheartbeat | enqueue_worker_heartbeat | *-*-* *:00/5:00 UTC
prunetasks | prune_db_task_results --queue-name * --min-age-days 14 --failed-min-age-days 30 | *-*-* 04:30:00 UTC
