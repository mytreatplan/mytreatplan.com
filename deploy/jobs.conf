# Scheduled jobs (story 1.9). One job per line:
#
#     name | manage.py command and arguments | schedule
#
# - name: lowercase letters, digits, '-' or '_'. It names the timer
#   (mytp-job@<name>.timer) and the Sentry cron monitor (mytp-<environment>-<name>).
# - schedule: a systemd OnCalendar expression ending in UTC, of the form
#   `[Mon..Fri ]*-*-<day|*> <hour|*>:<minute>[:00] UTC`, so it also maps to the
#   Sentry monitor's crontab (see mytp_publicsite/jobs.py).
#
# After changing this file, run deploy/provision.sh again on the server (it installs,
# updates and removes the timers). The job itself runs from the live release, via
# deploy/run-job.sh and `manage.py runjob <name>`.

clearsessions | clearsessions | *-*-* 03:30:00 UTC
backupdb | backupdb | *-*-* 02:30:00 UTC
