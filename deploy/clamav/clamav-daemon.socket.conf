# Installed by deploy/provision.sh to
# /etc/systemd/system/clamav-daemon.socket.d/mytp.conf (host-wide). Debian starts clamd
# through this socket unit, which would otherwise create the socket world-writable
# (0666): only the group clamav (the site users with a scan worker) may connect, as
# LocalSocketGroup / LocalSocketMode say in deploy/clamav/clamd.conf.
[Socket]
SocketUser=clamav
SocketGroup=clamav
SocketMode=0660
