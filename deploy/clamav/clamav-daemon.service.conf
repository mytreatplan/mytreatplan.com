# Installed by deploy/provision.sh to
# /etc/systemd/system/clamav-daemon.service.d/mytp.conf (host-wide): clamd reads the
# portal's configuration (deploy/clamav/clamd.conf, /etc/clamav/clamd-mytp.conf).
[Service]
ExecStart=
ExecStart=/usr/sbin/clamd --foreground=true --config-file=/etc/clamav/clamd-mytp.conf
