# clamd's configuration on a MyTreatplan staging host (host-wide, shared by every site).
# Installed by deploy/provision.sh to /etc/clamav/clamd-mytp.conf; clamav-daemon.service
# reads it through the drop-in deploy/clamav/clamav-daemon.service.conf. Debian's own
# /etc/clamav/clamd.conf stays as the package wrote it (clamdscan and freshclam's
# NotifyClamd read it; both name the same socket).
#
# The portal's scan worker (storage.tasks.scan_object_task) streams each upload here
# (INSTREAM). Only clamd's OK passes a file; everything it cannot fully scan must answer
# FOUND (rejected), never OK (AD-9, E6; epic-platform entry 12). See deploy/README.md
# "Object storage" -> "Scanning".

# --- Socket: the site users' scan workers connect as members of the group clamav ------
LocalSocket /run/clamav/clamd.ctl
FixStaleSocket true
LocalSocketGroup clamav
LocalSocketMode 660
User clamav
Foreground true
PidFile /run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
# A streamed file is spooled to disk while it is scanned (up to 1 GiB each): not /tmp,
# which is a RAM tmpfs on Debian 13. Created by provision.sh (clamav, 0700); AppArmor
# access in deploy/clamav/apparmor-usr.sbin.clamd.
TemporaryDirectory /var/lib/clamav/tmp

# --- Logs (journal) ------------------------------------------------------------------
LogSyslog true
LogFacility LOG_LOCAL6
LogTime true
LogClean false
LogVerbose false
ExtendedDetectionInfo true

# --- Load and memory ----------------------------------------------------------------
# Scans run one at a time per site (each site's scan worker); a few threads are enough.
MaxThreads 4
SelfCheck 3600
# The host has ~5.4 GB free with three sites and clamd takes 1-1.5 GB: a database reload
# must not hold a second copy of the signatures (scans wait during the reload instead).
ConcurrentDatabaseReload no

# --- Limits: at least the largest upload (purposes.MAX_SCANNED_SIZE, 1 GiB) -----------
# Just above 1 GiB so a file of exactly the purpose limit is fully scanned. A stream
# above StreamMaxLength is refused (ERROR: rejected); a file above MaxFileSize or a scan
# above MaxScanSize alerts (AlertExceedsMax: FOUND Heuristics.Limits.Exceeded.*).
StreamMaxLength 1025M
MaxFileSize 1025M
MaxScanSize 1025M
# Long enough for a 1 GiB file (the default, 2 minutes, is not); the scan task waits 15.
MaxScanTime 600000
# Archive and recursion limits stay at clamd's defaults (MaxRecursion, MaxFiles,
# MaxEmbeddedPE, MaxHTMLNormalize, MaxHTMLNoTags, MaxScriptNormalize, MaxZipTypeRcg,
# MaxPartitions, MaxIconsPE, MaxRecHWP3, PCREMatchLimit, ...).

# --- A file clamd cannot fully scan is reported as FOUND, never as OK ----------------
HeuristicAlerts yes
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertBrokenExecutables yes
# Off (decision 2026-11-08): malformed images and media are scanned, not rejected for
# being malformed (doctors' photos and scans are often slightly off-spec).
AlertBrokenMedia no
# Every file type is scanned (ScanArchive, ScanPE, ScanOLE2, ScanPDF, ... all default to
# yes and stay so).
