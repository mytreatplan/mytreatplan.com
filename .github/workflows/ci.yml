name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        # The major version staging runs (17.x), so the whole suite runs against it.
        image: postgres:17
        env:
          POSTGRES_USER: mytp
          POSTGRES_PASSWORD: mytp
          POSTGRES_DB: mytreatplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mytp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: 'False'
      # The test client speaks plain HTTP; without this, DEBUG off redirects it to HTTPS.
      SECURE_SSL_REDIRECT: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://mytp:mytp@localhost:5432/mytreatplan
      # Fixed non-secret field keys (the same as conftest.py), for `check` and `migrate`.
      FIELD_ENCRYPTION_KEYS: test1:dGVzdC1vbmx5LWZpZWxkLWtleS1ub3Qtc2VjcmV0ISE=
      BLIND_INDEX_KEY: dGVzdC1vbmx5LWJsaW5kLWluZGV4LWtleS0zMmJ5dGU=

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Compile translations
        run: python manage.py compilemessages

      - name: Build CSS
        run: npm ci && npm run build:css

      - name: Django checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest

  # Every push to master that passes `test` goes live on the staging host's portal sites,
  # one matrix leg each: `dev` (https://dev.mytpdso.com, REGION=eu) and `dev-ae`
  # (https://dev-ae.mytpdso.com, REGION=ae). Each leg builds its own tarball of the same
  # commit, logs in as mytp-<site> with that site's own deploy key, checks the commit is
  # still the tip of master and runs the host-wide release command for its site. The legs
  # are independent: one failing never cancels, blocks or rolls back the other. Each leg
  # checks the tip on its own, so if master moves between the two checks one site may
  # skip a commit the other released; the next push brings both to the same commit. The
  # dev-ae leg fails until deploy/README.md "Add dev-ae" is done (dev deploys either way).
  # Server setup and the secrets are described in deploy/README.md.
  deploy-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: dev
            domain: dev.mytpdso.com
            ssh_key_secret: STAGING_SSH_KEY
          - site: dev-ae
            domain: dev-ae.mytpdso.com
            ssh_key_secret: STAGING_SSH_KEY_DEV_AE
    environment:
      name: staging
      url: https://${{ matrix.domain }}
    # One deploy per site at a time; a newer push waits for the running one (never cancels
    # it). The sites have separate groups, so a slow dev-ae release never holds up dev.
    concurrency:
      group: deploy-staging-${{ matrix.site }}
      cancel-in-progress: false

    env:
      SHA: ${{ github.sha }}
      SITE: ${{ matrix.site }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Build CSS
        run: npm ci && npm run build:css

      - name: Build release tarball
        # The tracked files at this commit plus the built CSS (git-ignored), and last the
        # marker the release command requires (deploy/release-ready, git-ignored): only a
        # finished build has it.
        run: |
          git archive --format=tar -o release.tar "$SHA"
          printf '%s\n' "$SHA" > deploy/release-ready
          tar --append -f release.tar static/css/site.css deploy/release-ready
          gzip -9 release.tar

      - name: Configure SSH
        # The host key comes only from STAGING_KNOWN_HOSTS (no trust on first use).
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          # Each site's own deploy key (STAGING_SSH_KEY for dev, STAGING_SSH_KEY_DEV_AE for
          # dev-ae); it logs in only as that site's user.
          STAGING_SSH_KEY: ${{ secrets[matrix.ssh_key_secret] }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          if [ -z "$STAGING_SSH_KEY" ]; then
            echo "::error::No deploy key for $SITE: add the secret ${{ matrix.ssh_key_secret }} (deploy/README.md)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host staging
            HostName $STAGING_HOST
            User mytp-$SITE
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Check this is still the tip of master
        # Deploys queue, but not in push order: an older push whose tests finish later
        # must not replace a newer release. A newer push will deploy itself.
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$tip" = "$SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy of $SHA: master is now at $tip, a newer push supersedes it."
          fi

      - name: Upload release
        if: steps.tip.outputs.latest == 'true'
        run: |
          scp release.tar.gz "staging:/srv/mytp-$SITE/incoming/$SHA.tar.gz"

      - name: Release
        if: steps.tip.outputs.latest == 'true'
        run: |
          ssh staging /usr/local/bin/mytp-release "$SITE" "$SHA" "/srv/mytp-$SITE/incoming/$SHA.tar.gz"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
