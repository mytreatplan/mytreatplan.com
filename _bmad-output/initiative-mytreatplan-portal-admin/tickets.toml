# Epics of initiative-mytreatplan-portal-admin, in build order.

[[epic]]
id = 1
slug = "epic-platform"
title = "Two sites, two regions: platform baseline"
covers = ["P14", "P1"]

[[epic]]
id = 2
slug = "epic-regions"
title = "Customers land in the right region"
covers = ["P1"]
after = [{ epic = 1, needs = "REGION profile and global UUIDs" }]

[[epic]]
id = 3
slug = "epic-admin-access"
title = "Staff sign in to the admin site by role"
covers = ["P2"]
after = [{ epic = 1, needs = "admin repo, admindev staging and CI" }]

[[epic]]
id = 4
slug = "epic-admin-interface"
title = "Admin and regions exchange data within the rules"
covers = ["P3"]
after = [
  { epic = 1, needs = "admin repo, job runner, REGION profile" },
  { epic = 3, needs = "admin users and roles for remote access" },
  { epic = 2, needs = "home region on the client record (2.2)" },
]

[[epic]]
id = 5
slug = "epic-catalogue"
title = "Staff define what is sold, where and at what price"
covers = ["P4"]
after = [
  { epic = 2, needs = "country map model" },
  { epic = 3, needs = "admin roles and list conventions" },
  { epic = 4, needs = "configuration channel" },
]

[[epic]]
id = 6
slug = "epic-doctor-profile"
title = "Doctors keep their profile, fiscal data and maker logins"
covers = ["P5"]
after = [
  { epic = 1, needs = "job runner (1.9) and virus scanning (1.12)" },
  { epic = 2, needs = "country map and home region" },
  { epic = 3, needs = "mytp-core codes (3.2)" },
  { epic = 4, needs = "client record sync (4.8) and contract (4.2)" },
  { epic = 5, needs = "the resolver's VIES input (5.12)" },
]

[[epic]]
id = 7
slug = "epic-payments"
title = "Doctors pay and get invoiced by the right company"
