# Stories of epic-ordering, in build order. Requirements O1–O7 are in epic-ordering.md.

[[entry]]
id = 1
type = "story"
title = "Patients, work orders and a first ICE order"
description = "Tracer bullet and shared core: the regional patient model (name and surname or a code of the doctor's choosing, field-encrypted, comments, status; marked as crossing sites) with the patient-code generator (region prefix from 1.6 + 8 random Crockford base32 characters, never reused; AD-5) and the create-patient service epic-clinical-ops reuses (AD-15); the work-order model with the case stage machine as a mytp-core minor release (the full stage list, allowed transitions, one live work order per patient; AD-21) that epic-case-lifecycle reacts to and epic-clinical-ops requests named transitions on; the patient-name lookup for invoices (7.10); and the thinnest path: an ICE for a new patient ordered through 7.1 with the fake gateway creates its work order in 'pending assignment'."
verify = "On dev a doctor creates a patient, gets an EU-XXXXXXXX code, orders and pays an ICE with the fake gateway; a work order in 'pending assignment' exists; the invoice PDF shows the name next to the code; the stage machine refuses a transition it does not allow."
covers = ["O1", "O6"]
after = ["7.10", "8.1"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Patient list and portrait"
description = "Adds the basic patient list (code, name, status, created; epic-case-lifecycle later adds stage, history and comments) and the optional patient portrait uploaded through the storage service and scan (1.11, 1.12), regional only."
verify = "On dev the list shows a doctor's patients with code and status; a portrait appears only after the scan."
covers = ["O1"]
after = [1, "1.12"]
hitl = false
risk = "low"

[[entry]]
id = 12
type = "story"
title = "Logical account deletion with a regional archive"
description = "Replaces the physical purge of an erased doctor account and its patients with logical deletion: on erasure the region writes one encrypted, write-once archive of the account (profile, fiscal and shipping data, patients, work orders, orders and invoices as issued) to long-term object storage in that region, expired by a bucket lifecycle rule after the retention period, and the account and its patients leave every portal view; the superuser requests a read-only report of an archive from the admin site behind a fresh code, served through the remote-read path and logged in the region. A person sets the archive bucket's lifecycle and write-once rules as bucket owner."
verify = "On dev, erasing a test doctor with one patient writes one archive object that cannot be overwritten or deleted before its expiry, the doctor and patient no longer appear on the portal, and on admindev the superuser opens a read-only report of that archive after a fresh code while a Commercial Manager cannot; the region logs the access."
covers = ["O1"]
after = [2, "4.5", "4.8", "3.5", "1.11"]
hitl = true
risk = "high"
references = ["epic-ordering/story-patients-work-orders-and-a-first-ice-order-plan.md", "deferred-work.md"]

[[entry]]
id = 13
type = "story"
title = "Archive report on the admin site"
description = "Lets the superuser request a read-only report of an erased account's archive (9.12) from the admin site behind a fresh code: the admin asks the region through the remote-read path, the region decrypts the archive with its KMS-wrapped archive identity, logs the access, and returns the report without the admin site keeping it."
verify = "On admindev the superuser opens the report of the archive written on dev after a fresh code; a Commercial Manager is refused; dev logs the access; nothing of the report is stored on admindev."
covers = ["O1"]
after = [12, "4.5", "3.5"]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Case wizard: patient and TPS"
description = "Adds the wizard's patient step (choose or create) and the TPS branch: maker (Invisalign, Ormco Spark, Angel Aligner, Solventum, Smartee, not decided yet, other with a name) or in-house printing, then ICE, short, medium or long, one arch (-25%) and Junior I/II on medium only; for a named maker without a saved login the wizard warns and links to 6.8's maker-logins settings page and does not allow ordering until it is saved ('not decided yet' and 'other' excepted); a patient with a live work order cannot get a new service unless it is the planning after an ICE."
verify = "On dev the wizard adds a medium Invisalign TPS with Junior II to the cart; without a saved Invisalign login it shows the warning with the link and refuses; 'not decided yet' passes; a patient with a live non-ICE work order is refused."
covers = ["O3"]
after = [2, "6.8"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Case wizard: VirtuaOrtho"
description = "Adds the VirtuaOrtho branch, offered only where the resolver includes it: One or DigitalTwin, then short, medium, long, ODB, retainers (assumption: only after a finished treatment for that patient, tested with a fixture until epic-case-lifecycle finishes cases) or Spark on Demand (One only, 4–9 aligners, one or both arches), Byte Sync as an add-on, Junior only on medium; a shipping address (6.7) is required."
verify = "On dev an Iberia Advanced doctor (8.5 or a fixture, with 5.13's seed) adds a DigitalTwin medium with Byte Sync; Spark on Demand refuses 3 or 10 aligners; without a shipping address the wizard asks for one; a rest-of-EU doctor never sees the branch."
covers = ["O3"]
after = [3, "6.7", "5.13"]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Product pages and start-a-case links"
description = "Adds the VirtuaOrtho, planning-services and education pages (texts from the catalogue, per language, showing only what the resolver offers) and points 6.1's 'start a case' bar and tiles at the wizard."
verify = "An Advanced Iberia doctor sees VirtuaOrtho products on its page and an Advanced rest-of-EU doctor does not; the bar opens the wizard."
covers = ["O2"]
after = [4]
hitl = false
risk = "low"

[[entry]]
id = 6
type = "story"
title = "Cart and checkout"
description = "Adds the cart grouped by patient (one service per patient per order), stored regionally in the database across sign-ins (adds its AD-2 row), with 'add another' or 'finish order', and checkout through 7.1 with a try-me voucher option through 8.4 (a voucher covering everything makes a €0 order); the cart never spans two billing companies (AD-16), and the one-live-work-order rule is checked again at payment."
verify = "A doctor adds two patients' services, signs out and back in, and still sees the cart; checkout with a try-me voucher pays once in the Redsys test environment; the voucher cannot be used again; a second service for the same patient is refused."
covers = ["O4"]
after = [5, "8.4", "7.3"]
hitl = false
risk = "high"

[[entry]]
id = 14
type = "story"
title = "Responsive layout"
description = "Makes content width follow the screen on every doctor-facing portal page and the public site (tables, forms, cards, product pages, the case wizard, cart, checkout, settings) instead of a narrow fixed column, and makes dialogs (the 'Add a patient' dialog first) fit the viewport with their own scroll; mytp-admin (AdminLTE) is out of scope."
verify = "At 1440, 1024 and 390 px wide the patient list, wizard, cart and settings pages fill the available width without horizontal page scroll, and the 'Add a patient' dialog fits a 768 px tall screen with its buttons visible."
covers = ["O1", "O2", "O3", "O4"]
after = []
hitl = false
risk = "low"
notes = ["Content (tables, forms, pages) must be responsive: width adjusts to the screen, never a narrow fixed column stretched down the page; modals must fit the viewport (user, 2026-11-24)."]

[[entry]]
id = 15
type = "story"
title = "Patient search and paging"
description = "Adds a search box (code or part of the name, matched on the decrypted fields in the region) and paging to the patient list (entry 2), as a reusable patient-chooser fragment the redesigned wizard (entry 16) embeds."
verify = "With 60 patients on dev the list shows one page of results with page links, and a search by code or by part of a name finds the patient."
covers = ["O1"]
after = [2, 14]
hitl = false
risk = "low"

[[entry]]
id = 16
type = "story"
title = "Case wizard redesign with django-formtools"
description = "Rebuilds the case wizard (entries 3, 4) as step-by-step pages on django-formtools: patient (add new in the dialog, or choose an existing one through entry 15's chooser), product (two cards with a short explanation: Treatment Planning or VirtuaOrtho), TPS maker (in-house printing or brand-made aligners, brand revealing a select of makers), VirtuaOrtho type (One 'without patient monitoring' or DigitalTwin 'with patient monitoring'), then a last page with lengths and prices, add-ons and, for VirtuaOrtho, ODB, Spark on Demand and the shipping address as a select, ending in 'Add to cart'; a choice of three or more options is a select; every existing rule is kept (maker-login warning, one live work order, planning after ICE, VirtuaOrtho only where offered, retainers after a finished treatment, included cases)."
verify = "On dev a doctor adds a medium Invisalign TPS with Junior II and a DigitalTwin medium with Byte Sync to the cart through the new steps, and the existing wizard rule tests pass against the new flow."
covers = ["O3"]
after = [4, 6, 15]
hitl = false
risk = "high"
references = ["epic-ordering/story-case-wizard-patient-and-tps-plan.md", "epic-ordering/story-case-wizard-virtuaortho-plan.md"]

[[entry]]
id = 7
type = "story"
title = "ICE deduction"
description = "Deducts a paid ICE once from the first later planning (TPS or VirtuaOrtho) for the same patient, no time limit, only within the same billing company and currency, using the ICE line's snapshot net amount (AD-6) as the resolver's ICE input (5.12); the deduction is reserved when the order is created, consumed on payment and released on cancel or expiry (7.1 hooks); a refunded ICE gives none."
verify = "Ordering a medium TPS for a patient with a paid ICE deducts the ICE's paid net amount; two pending orders cannot both deduct it; a cancelled order releases it; a refunded ICE deducts nothing."
covers = ["O5"]
after = [6]
hitl = false
risk = "medium"

[[entry]]
id = 17
type = "story"
title = "Cart on transfer approval, no transfer expiry"
description = "When a doctor approves a cart order by bank transfer the order is closed as pending payment and the cart is emptied; bank-transfer orders no longer expire automatically (7.5's day-14 expiry removed; staff cancel through entry 18) and the reminder email is sent every 7 days until the order is paid or cancelled; the voucher and ICE reservations stay held until payment or cancel."
verify = "On dev approving a bank-transfer order empties the cart and leaves the order pending, and the expiry job no longer expires a 20-day-old transfer order."
covers = ["O4"]
after = [6, 14, "7.5"]
hitl = false
risk = "medium"

[[entry]]
id = 18
type = "story"
title = "Pending bank transfers on the admin site"
description = "Brings forward from epic-sales-finance a small 'Pending bank transfers' list on the admin site, read from each region's pending transfer orders over remote reads, with a 'confirm payment received' button (calls the region's `payments.service.mark_transfer_paid` over versioned remote writes: the order is paid, the invoice issued and the paid hook fired) and a 'cancel order' button (cancelled hook releases voucher and ICE reservations), both behind a fresh code, allowed by role and audit-logged."
verify = "On admindev a finance user confirms a pending dev transfer order after a fresh code, and dev shows it paid with one invoice."
covers = ["O4"]
after = [17, "4.5", "4.6", "3.5", "3.6", "3.8"]
hitl = false
risk = "medium"

[[entry]]
id = 19
type = "story"
title = "Pending-payment documents in the doctor's invoices list"
description = "A doctor's unpaid bank-transfer orders (pending payment, 9.17) appear in the doctor's invoices list (epic-payments 7.10) as pending-payment documents, clearly marked unpaid and stated not to be an invoice (a proforma or order document, not legally an invoice), and downloadable as a PDF that looks like the invoice: the same seller, buyer, lines and totals, plus the order reference to quote in the transfer and the bank details. Once the order is paid the document gives way to the real invoice; a cancelled order's document leaves the list. Decision (user, 2026-11-25, found during 9.18's staging check): no separate orders page; the invoices list is the one place."
verify = "On dev a doctor who approves a bank-transfer order sees it in the invoices list marked pending payment, downloads a PDF headed as a pending-payment document (not an invoice) with the reference and bank details, and after staff confirm the payment the list shows the real invoice instead."
covers = ["O4"]
after = [17, 8, "7.10"]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Work orders per service and order emails"
description = "Creates one work order per patient-service: on the paid hook in 'pending assignment'; for a bank-transfer order at the doctor's approval in 'pending payment' (blocking the patient like a live work order), turned live on the paid hook and cancelled with the order; closes a live ICE work order when its planning is paid, emits work-order events without patient data (stage, product category, region; a contract type) for epic-clinical-ops' workload figures, and sends the order confirmation and payment receipt emails (patients by code; epic-payments sends no such emails)."
verify = "Paying an order for two patients creates two work orders; paying a planning after an ICE closes the ICE work order; admindev receives the events without names; the emails name patients by code only."
covers = ["O6"]
after = [7, 17]
hitl = false
risk = "high"

[[entry]]
id = 9
type = "story"
title = "Pending-payment work orders"
description = "Adds the create-manual-work-order service epic-clinical-ops calls over remote writes and shows those work orders on 6.1's home page as 'pending payment' (not live until paid; unlike entry 8's transfer work orders these do not block other services), each addable to the cart and priced with the doctor's effective tier when added (8.1)."
verify = "A manual work order created through the service appears on the home page, is added to the cart at the doctor's current tier price, does not block other services, and once paid becomes a live work order."
covers = ["O7"]
after = [8]
hitl = false
risk = "medium"

