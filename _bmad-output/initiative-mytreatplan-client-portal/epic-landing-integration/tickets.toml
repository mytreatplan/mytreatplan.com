# Entries of epic-landing-integration. Table order is the build order; ids are permanent.

[[entry]]
id = 1
type = "story"
title = "Public site tracer bullet"
description = "Commits env-driven settings.py (removing the commented old SECRET_KEY) with a settings.env.example, untracks __pycache__ and static_root, adds a minimal custom user model in an accounts app before the first migration (signup entry 2.1 extends it), the base template with Tailwind built from design-system tokens and HTMX, the public-site view at `/` with the Home section, header and footer from mytreatplan.ae and its Inter font and images as static files, pytest-django, and a GitHub Actions workflow running the tests against a Postgres service; later pages and epic 2 extend this base template, and entry 8's deploy runs this Tailwind build."
verify = "Locally `/` shows the Home section matching mytreatplan.ae; AUTH_USER_MODEL points to accounts.User in the first migration; tests pass in GitHub Actions on push."
covers = ["E1", "E6"]
after = []
hitl = false
risk = "medium"
notes = ["Yes, reset dev if needed"]

[[entry]]
id = 2
type = "story"
title = "Port the remaining sections"
description = "Ports What we do, About us, Who we are, Where we are and the Contact info block, the desktop and mobile menus with burger behaviour, anchors and responsive images, matching mytreatplan.ae at mobile, tablet and desktop widths."
verify = "Side-by-side check against mytreatplan.ae at 480, 768 and 1200 px; tests assert every section and anchor renders."
covers = ["E1"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "English and Spanish"
description = "Sets up Django i18n with locale-prefixed URLs (i18n_patterns, which epic 2's `signup` and epic 3's `login` routes also use) and a language switcher in the base template, marks all public strings, and adds Spanish drafted by Claude for the team to review; signup entry 2.4 builds on it."
verify = "Every section renders in EN and ES with the switcher; a test fails on any untranslated public string; the team approved the Spanish."
covers = ["E2"]
after = [2]
hitl = true
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Legal pages, SEO and portal links"
description = "Ports Privacy and Terms (current texts until the lawyer's arrive, Spanish reviewed by the team), sitemap, robots, Open Graph and JSON-LD for mytreatplan.com, and menu links Sign up and Login resolved by URL names `signup` and `login`, hidden while those names are not registered."
verify = "Privacy and Terms render in EN and ES; sitemap and robots validate; the links are absent with no route and appear when a test registers the names."
covers = ["E3", "E4"]
after = [3]
hitl = true
risk = "low"

[[entry]]
id = 7
type = "spike"
title = "Choose production hosting"
description = "The team decides the staging and production host, its managed PostgreSQL and KMS, using the recommendation in the epic's Notes, and opens the accounts; the chosen KMS is passed to bmad-spec to update encryption-policy.md."
verify = "The decision and accounts are recorded in the epic's Notes."
covers = ["E6"]
after = []
hitl = true
risk = "high"
unknown = "OVHcloud Public Cloud chosen; staging opened 2026-10-11 (b2-7, GRA11, Debian 13). The production project is not opened yet."

[[entry]]
id = 8
type = "story"
title = "Staging-ready app settings"
description = "Makes the app safe to run on staging and production: security settings when DEBUG is off (secure cookies, proxy SSL header, CSRF_TRUSTED_ORIGINS and ALLOWED_HOSTS from env, short HSTS on staging), DB TLS from env with a deploy check that refuses a non-TLS database, a ROBOTS_NOINDEX switch (X-Robots-Tag header plus disallow-all robots.txt), the PORTAL_ENABLED switch that signup entry 2.1 registers behind, and pinned gunicorn; entry 13 deploys it."
verify = "Tests show the security settings with DEBUG off, the noindex header and robots.txt, the portal switch on and off, and the DB TLS check failing without TLS."
covers = ["E6"]
after = [4]
hitl = false
risk = "medium"

[[entry]]
id = 13
type = "story"
title = "Staging provisioning and deploy pipeline"
description = "Provisions https://dev.mytpdso.com on the OVHcloud GRA11 instance mytp-staging-1 (Debian 13) with an idempotent deploy/provision.sh the user runs over SSH (app user, Gunicorn under systemd behind Nginx, Let's Encrypt, HTTP basic auth, firewall), Managed PostgreSQL over TLS with an IP allowlist, a release.sh that switches releases only when migrations succeed, a GitHub Actions staging deploy on every push to master, and a runbook for the human steps and rollback; entry 12 reuses it for production."
verify = "A push to master deploys to https://dev.mytpdso.com over HTTPS behind the team password; a failed migration leaves the previous release serving; running provision.sh twice changes nothing."
covers = ["E6"]
after = [8]
hitl = true
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Contact form"
description = "Adds the contact form with the existing fields and limits, the anti-spam checks from enviar.php (honeypot, JS flag, minimum fill time, per-sender hourly limit on Django's database cache), HTMX submission in EN and ES, storage with admin listing, and email to the company inbox through the transactional email set up by epic-login entry 3.9 (the company's own SMTP mail service, from noreply@mytreatplan.com); marketing provides the inbox address."
verify = "Tests show valid submissions are stored and emailed (locmem backend) and each anti-spam rule silently drops the bot case; on staging a real message reaches the inbox."
covers = ["E5"]
after = [4, 13, "3.9"]
hitl = true
risk = "medium"
unknown = "The inbox address, from marketing."

[[entry]]
id = 9
type = "story"
title = "Scheduled jobs, monitoring and alerts"
description = "Adds systemd timers on the staging server that run Django management commands in the live release as mytp (first job: daily clearsessions; signup entry 2.10 and entry 6 register theirs the same way), Sentry error monitoring in its EU region with personal data scrubbed and missed-job (cron) monitoring, an unauthenticated lightweight health URL that Nginx serves outside basic auth, and hosted uptime checks with email alerts (signup entry 2.11's send-failure alert and entry 6's failures report through Sentry); entry 12 applies the same to production."
verify = "A forced error reaches Sentry without personal data; clearsessions runs from its timer and a missed run alerts; stopping Gunicorn triggers an uptime alert; the health URL answers without the team password."
covers = ["E6"]
after = [13]
hitl = true
risk = "medium"

[[entry]]
id = 14
type = "story"
title = "Off-region database backups and restore test"
description = "Keeps OVHcloud Managed PostgreSQL's automatic backups and adds a nightly encrypted pg_dump of the staging database to OVHcloud Object Storage in another region (e.g. Strasbourg), run by entry 9's timers, with retention, failure alerts through Sentry and a documented, tested restore into a scratch database; entry 12 applies it to production."
verify = "A nightly dump appears encrypted in the other region's bucket; a restore from it into a scratch database succeeds; a failed dump alerts."
covers = ["E6"]
after = [9]
hitl = true
risk = "medium"

[[entry]]
id = 15
type = "story"
title = "OVHcloud KMS provisioning"
description = "Provisions OVHcloud KMS for the project (an encryption key for staging, access credentials stored only on the server), verifies the staging server can wrap and unwrap a test data key, and documents key rotation and access; signup entry 2.12 implements the key provider on it; entry 12 provisions production's key."
verify = "From the staging server a test data key is wrapped and unwrapped through OVHcloud KMS; the credentials are only on the server; rotation is documented."
covers = ["E6"]
after = [13]
hitl = true
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Forward contact messages to the CRM"
description = "Forwards each stored contact message to the chosen CRM as a lead through its API with credentials from environment secrets, retrying failures from a cron management command and marking forwarded rows in admin."
verify = "With a sandbox CRM account a submission appears as a lead; a forced API failure is retried by the cron job and stays visible in admin."
covers = ["E5"]
after = [5, 9]
hitl = true
risk = "medium"
unknown = "CRM choice; Zoho is likely."

[[entry]]
id = 12
type = "story"
title = "Production environment and promotion"
description = "Provisions production on its own OVHcloud GRA11 project with entry 13's setup (Managed PostgreSQL over TLS, HTTPS, secrets, Gunicorn/systemd/Nginx, no basic auth, indexable), the portal switch off until epic 3, entry 9's timers and monitoring, entry 14's backups and entry 15's KMS applied to production, and a manual-approval GitHub Actions job that promotes the exact build already deployed to staging."
verify = "A manual approval deploys the staging build to production over HTTPS; the DB connection uses TLS; the portal switch is off; backups, monitoring and cron run on production."
covers = ["E6"]
after = [7, 9, 13, 14, 15]
hitl = true
risk = "high"

[[entry]]
id = 10
type = "story"
title = "Public site go-live"
description = "Points mytreatplan.com DNS to production with TLS and releases the public site with portal features off; mytreatplan.ae stays on its current hosting unchanged."
verify = "mytreatplan.com loads over HTTPS in EN and ES; the contact form delivers in production; Sign up and Login links are hidden in production."
covers = ["E1", "E6"]
after = [4, 6, 9, 12]
hitl = true
risk = "medium"
unknown = "Final mytreatplan.com legal texts (Privacy and Terms, EN and ES) from the lawyer; until then LEGAL_TEXTS_FINAL stays False and check --deploy fails (story 1.4)."

