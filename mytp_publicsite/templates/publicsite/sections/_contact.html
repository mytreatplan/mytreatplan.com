{% load i18n static %}
<section id="contact" class="relative mt-[clamp(20px,4vw,60px)]">
  <img class="block min-h-[200px] w-full object-cover"
       src="{% static 'img/Img_Contact.webp' %}"
       srcset="{% static 'img/Img_Contact-480.webp' %} 480w, {% static 'img/Img_Contact-768.webp' %} 768w, {% static 'img/Img_Contact-1200.webp' %} 1200w, {% static 'img/Img_Contact.webp' %} 1980w"
       sizes="(min-width: 1440px) 1440px, 100vw" width="1980" height="1191" alt="" loading="lazy">
  <h2 class="absolute top-[24%] left-1/2 w-max max-w-[90vw] -translate-1/2 text-center text-h2 font-black text-ink max-tablet:static max-tablet:w-auto max-tablet:max-w-none max-tablet:translate-none max-tablet:px-gutter max-tablet:pt-4 max-tablet:pb-[22px]">{% translate "Contact" %}</h2>
</section>

{# Contact info pulls up over its banner above 700px. The form arrives in story 1.5. #}
<section class="relative z-2 mt-[calc(-1*clamp(70px,13vw,210px))] px-gutter pt-[clamp(16px,2.5vw,34px)] pb-[clamp(20px,3vw,36px)] text-center max-tablet:mt-0">
  <p class="text-sub/[1.55]">{% translate "Get in touch" %}</p>
  <p class="mt-2.5 text-h3/[1.55] font-bold tracking-normal"><a href="mailto:sayhi@mytreatplan.com">sayhi@mytreatplan.com</a></p>
</section>
